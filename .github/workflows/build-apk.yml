name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor web folder
        run: |
          echo "Procurando index.html..."
          INDEX_PATH=$(find . -path "./node_modules" -prune -o -name "index.html" -print | head -n 1)
          echo "Index encontrado em: $INDEX_PATH"

          if [ -z "$INDEX_PATH" ]; then
            echo "Nenhum index.html encontrado depois do build."
            find . -maxdepth 4 -type f
            exit 1
          fi

          BUILD_DIR=$(dirname "$INDEX_PATH")
          echo "Copiando build de $BUILD_DIR para www"
          rm -rf www
          mkdir -p www
          cp -R "$BUILD_DIR"/. www/

          echo "Conteúdo da pasta www:"
          ls -la www

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Add Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bodyai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
